}

.pasos li{display:flex;align-items:center;gap:8px}

.opc input{margin-top:3px;width:auto;flex:none}

.barra-idioma{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:-8px 0 8px}
.barra-idioma .lab{margin-right:2px}
.idi{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--muted);border:1px solid var(--line);padding:3px 9px;font-size:12px;font-weight:700;border-radius:999px}
.idi:hover{color:var(--ink);border-color:var(--ink)}
.idi[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);background:var(--surface)}
.idi svg{width:20px;height:13px;border-radius:2px;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.derecha{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:flex-end}
@media (prefers-reduced-motion:no-preference){nav.tabs a{transition:background .15s,color .15s}}

.derecha{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.derecha-2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:flex-end}
.sel-liga{display:flex;align-items:center;gap:6px}
.sel-liga label{margin:0}
.sel-liga select{width:auto;max-width:220px;padding:5px 8px;font-size:14px;font-weight:600}
.sesion{display:flex;align-items:center;gap:8px;min-width:0}
.sesion .muted{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.btn-entrar{font-weight:700;font-size:14px;text-decoration:none;padding:6px 14px;border-radius:999px;border:1px solid var(--ink)}
a.btn-entrar:hover,a.btn-entrar[aria-current="page"]{background:var(--ink);color:var(--bg)}
.plazo{background:var(--sunk);border-left:4px solid var(--good);padding:10px 14px;margin:0 0 14px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.acciones{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.ok-txt{color:var(--good);font-weight:600}
.err-txt{color:var(--accent);font-weight:600}
.panel.entrar{max-width:420px;margin:8px auto 0}
.pestanas{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.pestanas button{background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;border-radius:0;padding:8px 12px}
.pestanas button.on{color:var(--ink);border-bottom-color:var(--accent)}
.fila-admin.dueno{flex-wrap:wrap}
.dueno-ctl{display:flex;gap:6px;align-items:center;flex:1 1 300px;justify-content:flex-end;min-width:0;flex-wrap:wrap}
.dueno-ctl input{max-width:240px;padding:5px 8px;font-size:13px}
code{font-family:var(--f-mono);font-size:.92em;background:var(--sunk);padding:1px 5px;border-radius:3px}
.ligas-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.liga-card{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.liga-card.actual{border-color:var(--good);box-shadow:inset 4px 0 0 var(--good)}
.liga-cab{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:16px}
.codigo-linea{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.codigo-grande{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.codigo-grande span{font-family:var(--f-mono);font-size:32px;font-weight:600;letter-spacing:.06em;background:var(--sunk);padding:6px 14px;border-radius:var(--r)}
.panel.nueva-liga{border-color:var(--good);margin-bottom:16px}
label.check{display:flex;gap:10px;align-items:flex-start;text-transform:none;letter-spacing:0;font-weight:400;font-size:13px;color:var(--ink);margin:4px 0 8px}
label.check input{width:auto;margin-top:3px}
tr.mio td{background:var(--sunk)}
@media (max-width:700px){.derecha{align-items:flex-start}.derecha-2{justify-content:flex-start}}

<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
"use strict";
/* ---------- conexión ---------- */
const CFG = window.LIGA_CONFIG || {};
const configurado = !!(CFG.url && CFG.anonKey && !/PEGA_AQUI|XXXX/.test(CFG.url + CFG.anonKey));
const sb = (configurado && window.supabase) ? window.supabase.createClient(CFG.url, CFG.anonKey) : null;

const DEF_CONFIG = {minimo:375, max_cambios:2, divisor:25, exclusivo:false, puntuacion:"total"};
// Modalidad Clásica: solo minutos, rating (x4) y resultado. Usa lo que calcula el script (tc/dc); si es una jornada antigua, lo rehace.
function aClasica(p){
  if(!p) return p;
  if(p.tc!==undefined) return {...p, t:p.tc, d:p.dc};
  const d=(p.d||[]).filter(([c])=>/^(No juega|No convocado|Menos de 30|Resultado)/.test(c)).map(x=>[...x]);
  if(p.rating) d.splice(d.findIndex(([c])=>/^Menos de 30/.test(c))+1, 0, [`Rating ${(+p.rating).toFixed(1)}`, Math.round((6.5-p.rating)*4*100)/100]);
  return {...p, t:Math.round(d.reduce((a,[,v])=>a+v,0)*100)/100, d};
}
const CLASICA = () => S.config.puntuacion==="clasica";
const S = {config:{...DEF_CONFIG}, jugadores:[], jornadas:{}, cal:{}, equipos:[], propietarios:[], miembros:[]};
let J = new Map();
let user = null, esAdmin = false, miEquipoId = null, misLigas = [], ligaId = null;
let cargado = false, errorCarga = "", ultimaCarga = 0;
const app = document.getElementById("app");
const POSS = ["POR","DEF","MED","DEL"];
const LIM = {POR:[1,1],DEF:[4,4],MED:[3,4],DEL:[2,3]};
const RUTAS = {inicio:"Inicio", clasificacion:"Clasificación", equipos:"Equipos", fichar:"Mi equipo", jornadas:"Jornadas", reglas:"Reglas", ligas:"Ligas", admin:"Admin", entrar:"Entrar"};

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let LANG = "es"; try { LANG = localStorage.getItem("ld_lang")==="en" ? "en" : "es"; } catch(e){}
const LOC = () => LANG==="en" ? "en-GB" : "es-ES";
const f1 = x => (Math.round(x*10)/10).toLocaleString(LOC(),{minimumFractionDigits:1,maximumFractionDigits:1});
const ptsHtml = x => `<span class="pts ${x>0?"pos":x<0?"neg":""}">${x>0?"+":""}${f1(x)}</span>`;
const M = x => f1(x)+" M";
const mult = j => 1 + ((j&&j.precio)||0)/S.config.divisor;
const ptsFinal = (p,j) => !p ? 0 : p.t>0 ? p.t*mult(j) : p.t;
const fx = m => "×"+(Math.round(m*100)/100).toLocaleString(LOC(),{minimumFractionDigits:2,maximumFractionDigits:2});
const f2 = x => (Math.round(x*100)/100).toLocaleString(LOC(),{minimumFractionDigits:2,maximumFractionDigits:2});
const nums = () => Object.keys(S.jornadas).map(Number).sort((a,b)=>a-b);
const fecha = iso => { try { return new Date(iso).toLocaleString(LOC(),{weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit"}); } catch(e){ return iso; } };
const hace = iso => { const m=Math.round((Date.now()-new Date(iso).getTime())/60000); return m<1?"hace un momento":m<60?`hace ${m} min`:m<1440?`hace ${Math.round(m/60)} h`:`hace ${Math.round(m/1440)} días`; };
const guardaLocal = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
const leeLocal = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
function objetivo(){ const ahora=Date.now(); let o=null; Object.entries(S.cal).forEach(([n,ini])=>{ if(ini && new Date(ini).getTime()>ahora && (o===null||+n<o)) o=+n; }); return o; }
const liga = () => misLigas.find(l=>l.id===ligaId) || null;
const soyAdminLiga = () => { const l=liga(); return !!(l && (l.rol==="admin" || esAdmin)); };

/* ---------- datos ---------- */
async function cargar(){
  if(!sb) return;
  const [jg, jo] = await Promise.all([
    sb.from("jugadores").select("*").range(0,4999),
    sb.from("jornadas").select("*").order("n")
  ]);
  const err = [jg,jo].find(r=>r.error);
  if(err) throw new Error(err.error.message);
  S.jugadores = (jg.data||[]).map(j=>({id:+j.id, nombre:j.nombre, equipo:j.equipo, equipo_id:j.equipo_id, pos:j.pos_manual||j.pos, pos_orig:j.pos, pos_manual:j.pos_manual, precio:+j.precio, baja:j.baja||null, baja_info:j.baja_info||"", baja_act:j.baja_actualizada||null}));
  J = new Map(S.jugadores.map(j=>[j.id,j]));
  S.cal = {}; S.jornadas = {};
  (jo.data||[]).forEach(r=>{
    S.cal[r.n] = r.inicio;
    if(r.puntos && Object.keys(r.puntos).length) S.jornadas[r.n] = {jornada:r.n, partidos:r.partidos||[], puntos:r.puntos, avisos:r.avisos||[], actualizado:r.actualizado, inicio:r.inicio};
  });
  esAdmin=false; misLigas=[]; S.equipos=[]; S.propietarios=[]; S.miembros=[]; miEquipoId=null; S.config={...DEF_CONFIG};
  if(user){
    const me=(user.email||"").toLowerCase();
    const [ad, mi, li] = await Promise.all([sb.from("admins").select("email"), sb.from("miembros").select("liga_id,email,rol"), sb.from("ligas").select("*")]);
    const e2=[ad,mi,li].find(r=>r.error); if(e2) throw new Error(e2.error.message);
    esAdmin = !!(ad.data||[]).find(r=>String(r.email).toLowerCase()===me);
    const mias = (mi.data||[]).filter(r=>String(r.email).toLowerCase()===me);
    misLigas = mias.map(m=>{ const l=(li.data||[]).find(x=>x.id===m.liga_id); return l?{...l, minimo:+l.minimo, divisor:+l.divisor, max_cambios:+l.max_cambios, rol:m.rol}:null; }).filter(Boolean)
      .sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
    if(!misLigas.find(l=>l.id===ligaId)){ const g=leeLocal("ld_liga"); ligaId = (misLigas.find(l=>l.id===g)||misLigas[0]||{}).id || null; }
    const l = liga();
    if(l){
      S.config = {minimo:l.minimo, max_cambios:l.max_cambios, divisor:l.divisor, exclusivo:!!l.exclusivo, puntuacion:l.puntuacion==="clasica"?"clasica":"total"};
      if(CLASICA()) Object.values(S.jornadas).forEach(jr=>{ jr.puntos=Object.fromEntries(Object.entries(jr.puntos).map(([k,p])=>[k,aClasica(p)])); });
      const eq = await sb.from("equipos").select("*").eq("liga_id", l.id);
      if(eq.error) throw new Error(eq.error.message);
      const ids = (eq.data||[]).map(e=>e.id);
      const [ve, pr] = await Promise.all([
        ids.length ? sb.from("versiones").select("*").in("equipo_id", ids).range(0,9999) : Promise.resolve({data:[]}),
        sb.from("propietarios").select("equipo_id,email,liga_id").eq("liga_id", l.id)
      ]);
      if(ve.error) throw new Error(ve.error.message);
      S.equipos = (eq.data||[]).map(e=>({id:e.id, nombre:e.nombre, manager:e.manager,
        versiones:(ve.data||[]).filter(v=>v.equipo_id===e.id).map(v=>({desde:+v.desde, ids:(v.ids||[]).map(Number), pos:v.pos||{}, sistema:v.sistema})).sort((a,b)=>a.desde-b.desde)}));
      S.propietarios = pr.data||[];
      const mio = S.propietarios.find(r=>String(r.email).toLowerCase()===me);
      miEquipoId = mio ? mio.equipo_id : null;
      if(soyAdminLiga()){ const mm = await sb.from("miembros").select("email,rol").eq("liga_id", l.id); S.miembros = mm.data||[]; }
    }
  }
  cargado = true; errorCarga = ""; ultimaCarga = Date.now();
}
async function recargar(silencioso){
  try { await cargar(); } catch(e){ errorCarga = e.message || String(e); }
  if(silencioso && ruta()==="fichar" && borrador.sucio) return;   // no pisar lo que estás editando
  render();
}
function cambiarLiga(id){ ligaId=id; guardaLocal("ld_liga", id); borrador.sucio=false; borrador.clave=""; eqSel=null; recargar(); }

function tr(s){
  if(LANG!=="en") return s;
  const k0=s.trim(); if(!k0) return s;
  const pre=k0.startsWith("· ")?"· ":"", k=pre?k0.slice(2):k0;
  let r=EN[k];
  if(r===undefined){ for(const [re,rp] of EN_RE){ if(re.test(k)){ r=k.replace(re,rp); break; } } }
  return r===undefined ? s : s.replace(k0,pre+r);
}
function traducir(root){
  if(LANG!=="en"||!root) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>/^(SCRIPT|STYLE)$/.test(n.parentNode&&n.parentNode.nodeName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const ns=[]; while(w.nextNode()) ns.push(w.currentNode);
  ns.forEach(n=>{const v=tr(n.nodeValue); if(v!==n.nodeValue) n.nodeValue=v;});
  [root,...(root.querySelectorAll?root.querySelectorAll("[placeholder],[aria-label],[title]"):[])].forEach(e=>e.getAttribute&&["placeholder","aria-label","title"].forEach(a=>{const v=e.getAttribute(a); if(v){const x=tr(v); if(x!==v) e.setAttribute(a,x);}}));
}

/* ---------- reglas del juego ---------- */
function posMapa(v){const m={}; v.ids.forEach(id=>{const p=(v.pos&&v.pos[id])||(J.get(id)||{}).pos; if(p) m[id]=p}); return m}
function sellar(){S.equipos.forEach(e=>e.versiones.forEach(v=>{if(!v.pos) v.pos=posMapa(v)}))}
function mapaNuevo(ids,fijas){const m={}; ids.forEach(id=>{const p=(fijas&&fijas[id])||(J.get(id)||{}).pos; if(p) m[id]=p}); return m}
function validar(ids,fijas){
  const sel = ids.map(i=>J.get(i)).filter(Boolean);
  const cuenta = {POR:0,DEF:0,MED:0,DEL:0}, clubes = {};
  let gasto = 0;
  sel.forEach(j=>{cuenta[(fijas&&fijas[j.id])||j.pos]++; clubes[j.equipo]=(clubes[j.equipo]||0)+1; gasto+=j.precio});
  const MIN = S.config.minimo, err = [];
  if (sel.length!==11) err.push(`Faltan ${11-sel.length} jugadores (tienes ${sel.length} de 11).`);
  POSS.forEach(p=>{const [a,b]=LIM[p]; if(cuenta[p]<a||cuenta[p]>b) err.push(`${p}: tienes ${cuenta[p]}, se permiten ${a===b?a:a+" a "+b}.`)});
  Object.entries(clubes).forEach(([c,n])=>{ if(n>3) err.push(`${c}: ${n} jugadores, máximo 3 por club.`)});
  if (gasto<MIN) err.push(`Tienes que gastar al menos ${M(MIN)}; te faltan ${M(MIN-gasto)}.`);
  return {ok:!err.length, err, cuenta, clubes, gasto};
}
function versionEn(eq,n){ if(S.config.exclusivo) return eq.versiones.find(x=>x.desde===n)||null; let v=null; eq.versiones.forEach(x=>{if(x.desde<=n&&(!v||x.desde>=v.desde))v=x}); return v}
function puntosEquipo(eq,n){
  const jor=S.jornadas[n], v=versionEn(eq,n); if(!jor) return null;
  if(!v){ if(S.config.exclusivo && eq.versiones.some(x=>x.desde<n)) return {total:-88, filas:[], vacio:true}; return null; }
  const filas=v.ids.map(id=>({j:J.get(id)||{id,nombre:"Jugador "+id,pos:"?",equipo:"?"}, p:jor.puntos[String(id)]||null}));
  return {total:filas.reduce((s,f)=>s+ptsFinal(f.p,f.j),0), filas};
}
function clasificacion(){
  const ns=nums();
  return S.equipos.map(eq=>{
    const porJ=ns.map(n=>{const r=puntosEquipo(eq,n);return r?r.total:null});
    const jug=porJ.filter(x=>x!==null);
    return {eq, porJ, total:jug.reduce((a,b)=>a+b,0), jugadas:jug.length, ultima:jug.length?jug[jug.length-1]:null};
  }).sort((a,b)=>b.total-a.total);
}
function cambios(a,b){const s=new Set(a); return b.filter(x=>!s.has(x)).length}

  const js=el.querySelector("#jeq"); if(js) js.addEventListener("change",e=>{jEq=+e.target.value;vEquipos(el)});

  "Barcelona":["#a50044","#004d98","rayas"], "Atlético Madrid":["#cb3524","#ffffff","rayas"],
  "Real Madrid":["#ffffff","#d4a017","liso"], "Real Betis":["#00954c","#ffffff","rayas"],

  "Racing Club":["#ffffff","#00843d","liso"], "Alavés":["#ffffff","#0057a8","rayas"],
  "Villarreal":["#ffe667","#005187","liso"], "Celta":["#8ac3ee","#c8102e","liso"],
  "Espanyol":["#ffffff","#007fc8","rayas"], "Rayo Vallecano":["#ffffff","#e53027","banda"],
  "Getafe":["#005999","#ffffff","liso"], "Osasuna":["#d91a21","#0a346f","liso"],
  "Elche":["#ffffff","#05642c","franja"], "Levante":["#b4053f","#004d98","rayas"],
  "Valencia":["#ffffff","#111111","liso"], "Málaga":["#ffffff","#0075c9","rayas"]
};
let kitN = 0;
function camiseta(club, s){
  s = s || 28;
  const [a,b,st] = KITS[club] || ["#9aa5a0","#5f6b65","liso"];
  const id = "kit" + (++kitN);
  const body = "M13 4 L7 6.5 L2 12.5 L6.5 18 L10 15.5 L10 37 L30 37 L30 15.5 L33.5 18 L38 12.5 L33 6.5 L27 4 C25 7.5 15 7.5 13 4 Z";
  let extra = "";
  if (st==="rayas") extra = `<g clip-path="url(#${id})" fill="${b}"><rect x="6" y="0" width="4" height="40"/><rect x="14" y="0" width="4" height="40"/><rect x="22" y="0" width="4" height="40"/><rect x="30" y="0" width="4" height="40"/></g>`;
  if (st==="banda") extra = `<g clip-path="url(#${id})" fill="${b}"><polygon points="8 4 14 4 32 37 26 37"/></g>`;
  if (st==="franja") extra = `<g clip-path="url(#${id})" fill="${b}"><rect x="0" y="17" width="40" height="5"/></g>`;
  return `<svg class="camiseta" width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><defs><clipPath id="${id}"><path d="${body}"/></clipPath></defs>`
    + `<path d="${body}" fill="${a}"/>${extra}<path d="M13 4 C15 7.5 25 7.5 27 4" fill="none" stroke="${b}" stroke-width="2"/>`
    + `<path d="${body}" fill="none" stroke="var(--kit-line)" stroke-width="1"/></svg>`;
}

/* ---------- mi equipo (fichar) ---------- */
const FORMAS = {"4-4-2":{POR:1,DEF:4,MED:4,DEL:2}, "4-3-3":{POR:1,DEF:4,MED:3,DEL:3}};
let borrador = {ids:[], nombre:"", manager:"", fijas:null, formacion:"4-4-2", sucio:false, clave:""};
const filtro = {pos:"", club:"", q:"", orden:"precio_desc"};
let arrastrando = null, msgGuardar = null, ocupados = new Set();
const posB = j => (borrador.fijas&&borrador.fijas[j.id]) || j.pos;
function porPos(){ const g={POR:[],DEF:[],MED:[],DEL:[]}; borrador.ids.forEach(i=>{const j=J.get(i); if(j) g[posB(j)].push(j)}); return g; }
function hayHueco(pos){ return porPos()[pos].length < FORMAS[borrador.formacion][pos]; }
function miEquipo(){ return S.equipos.find(e=>e.id===miEquipoId) || null; }
function bases(){
  const eq=miEquipo(), o=objetivo();
  if(!eq) return {eq:null, base:null, pend:null, o};
  let base=null, pend=null;
  eq.versiones.forEach(v=>{ if(o!==null && v.desde===o) pend=v; else if((o===null||v.desde<o) && (!base||v.desde>base.desde)) base=v; });
  if(S.config.exclusivo) base=null;   // modo exclusivo: cada jornada se empieza de cero
  return {eq, base, pend, o};
}
function iniciarBorrador(){
  const {eq, base, pend, o} = bases();
  const clave = (user?user.email:"")+"|"+(ligaId||"")+"|"+(miEquipoId||"")+"|"+o+"|"+(pend?pend.ids.join(","):"")+"|"+(base?base.ids.join(","):"");
  if(borrador.clave===clave && borrador.sucio) return;
  const v = pend || base;
  borrador = {ids: v ? v.ids.filter(i=>J.has(i)) : [], nombre: eq?eq.nombre:"", manager: eq?eq.manager:"",
              fijas: base ? posMapa(base) : null, formacion: (v&&FORMAS[v.sistema])?v.sistema:"4-4-2", sucio:false, clave};
  if(v && !v.sistema){ const del=borrador.ids.map(i=>J.get(i)).filter(j=>j&&posB(j)==="DEL").length; borrador.formacion = del>=3?"4-3-3":"4-4-2"; }
}
function tocar(){ borrador.sucio = true; msgGuardar = null; }

function vFichar(el){

  el.innerHTML=`<h2>Mi equipo</h2>
  ${plazo}
  <p class="leyenda small muted"><span class="baja baja-lesion">${BAJAS.lesion[1]}</span> lesionado · <span class="baja baja-duda">?</span> duda · <span class="baja baja-sancion"></span> sancionado <span class="muted">(según SofaScore para su próximo partido)</span></p>
  <p class="sub">Elige el sistema y rellena los 11 huecos: pulsa un hueco vacío para ver jugadores de esa posición, o arrastra un jugador desde la lista. Gasta al menos ${M(S.config.minimo)} y no repitas más de 3 de un mismo club.${base?` Puedes hacer hasta ${S.config.max_cambios} cambios por jornada.`:""}</p>
  <div class="fichar">
    <section class="col-campo">

        <select id="f-club" aria-label="Club"><option value="">Todos los clubes</option>${clubs.map(c=>`<option${filtro.club===c?" selected":""}>${esc(c)}</option>`).join("")}</select>
        <input id="f-q" type="search" placeholder="Buscar jugador" value="${esc(filtro.q)}" aria-label="Buscar jugador">
        <select id="f-orden" aria-label="Orden"><option value="precio_desc">Más caros primero</option><option value="precio_asc"${filtro.orden==="precio_asc"?" selected":""}>Más baratos primero</option><option value="nombre"${filtro.orden==="nombre"?" selected":""}>Por nombre</option></select>
      </div><div class="lista" id="lista"></div>
    </section>
  </div>`;
  const upd=()=>{filtro.pos=el.querySelector("#f-pos").value;filtro.club=el.querySelector("#f-club").value;filtro.q=el.querySelector("#f-q").value;filtro.orden=el.querySelector("#f-orden").value;pintarLista();pintarCampo()};
  ["f-pos","f-club","f-orden"].forEach(id=>el.querySelector("#"+id).addEventListener("change",upd));

  pintarLista(); pintarCampo();

async function cargarOcupados(){
  if(!S.config.exclusivo||!sb||!ligaId){ ocupados=new Set(); return; }
  const {data,error}=await sb.rpc("ocupados_liga",{p_liga:ligaId});
  if(!error){ ocupados=new Set((data||[]).map(r=>+(r.jugador_id!==undefined?r.jugador_id:r))); pintarLista(); }
}

function pintarLista(){
  const nrm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const q=nrm(filtro.q.trim());
  let l=S.jugadores.filter(j=>(!filtro.pos||j.pos===filtro.pos)&&(!filtro.club||j.equipo===filtro.club)&&(!q||nrm(j.nombre).includes(q)));
  l.sort(filtro.orden==="precio_asc"?(a,b)=>a.precio-b.precio:filtro.orden==="nombre"?(a,b)=>a.nombre.localeCompare(b.nombre,"es"):(a,b)=>b.precio-a.precio);
  const total=l.length; l=l.slice(0,200);
  const sel=new Set(borrador.ids), libre={}; POSS.forEach(p=>libre[p]=hayHueco(p));
  const box=document.getElementById("lista"); if(!box) return;
  box.innerHTML=l.map(j=>{
    const esta=sel.has(j.id), ocup=!esta&&ocupados.has(j.id), puede=esta||(libre[j.pos]&&!ocup);
    return `<div class="fila-j${puede&&!esta?" arrastrable":""}"${puede&&!esta?` draggable="true" data-drag="${j.id}"`:""}>${camiseta(j.equipo,24)}<span class="tag ${j.pos}">${j.pos}</span>
    <span class="nom">${jn(j)} <span class="muted small">· ${esc(j.equipo)}</span></span><span class="num">${M(j.precio)} <span class="muted small">${fx(mult(j))}</span></span>
    <button class="mini ${esta?"peligro":"sec"}" data-id="${j.id}" ${puede?"":"disabled"} aria-label="${esta?"Quitar":"Fichar"} ${esc(j.nombre)}">${esta?"Quitar":ocup?"Ocupado":puede?"Fichar":"Completo"}</button></div>`}).join("")
    +(total>200?`<p class="muted small" style="padding:8px 4px">Mostrando 200 de ${total}. Filtra para ver el resto.</p>`:"")
    +(!total?`<p class="muted small" style="padding:8px 4px">Ningún jugador coincide con el filtro.</p>`:"");
  box.querySelectorAll("button[data-id]").forEach(b=>b.addEventListener("click",()=>alternar(+b.dataset.id)));
  box.querySelectorAll("[data-drag]").forEach(r=>{
    r.addEventListener("dragstart",e=>{const j=J.get(+r.dataset.drag); arrastrando=j; try{e.dataTransfer.setData("text/plain",String(j.id));e.dataTransfer.effectAllowed="copy"}catch(_){}
      document.querySelectorAll(`.hueco.libre[data-pos="${j.pos}"]`).forEach(h=>h.classList.add("destino"))});
    r.addEventListener("dragend",()=>{arrastrando=null; document.querySelectorAll(".hueco").forEach(h=>h.classList.remove("destino","drop"))});
  });
}

function alternar(id){
  const i=borrador.ids.indexOf(id);
  if(i>=0) borrador.ids.splice(i,1);
  else { const j=J.get(id); if(!j||!hayHueco(posB(j))) return; borrador.ids.push(id); }
  tocar(); pintarLista(); pintarCampo();
}

function pintarCampo(){
  const campo=document.getElementById("campo"); if(!campo) return;
  const F=FORMAS[borrador.formacion], g=porPos();
  const lleno=j=>`<div class="hueco lleno" data-pos="${posB(j)}"><button class="quitar" data-q="${j.id}" aria-label="Quitar a ${esc(j.nombre)}">×</button>${camiseta(j.equipo,34)}
      <div class="fn">${jn(j)}</div><div class="fc">${M(j.precio)} · ${fx(mult(j))}</div></div>`;
  const libre=p=>`<button class="hueco libre${filtro.pos===p?" activo":""}" data-pos="${p}" aria-label="Elegir ${p}"><span class="mas">+</span><span>${p}</span></button>`;
  campo.innerHTML=["DEL","MED","DEF","POR"].map(p=>{
    const n=F[p], js=g[p].slice(0,n);
    return `<div class="linea">${js.map(lleno).join("")}${Array.from({length:n-js.length},()=>libre(p)).join("")}</div>`;
  }).join("");
  campo.querySelectorAll("button[data-q]").forEach(b=>b.addEventListener("click",()=>alternar(+b.dataset.q)));
  campo.querySelectorAll(".hueco.libre").forEach(h=>{
    h.addEventListener("click",()=>{
      filtro.pos=h.dataset.pos; const s=document.getElementById("f-pos"); if(s) s.value=filtro.pos;
      pintarLista(); pintarCampo();
      if(matchMedia("(max-width:860px)").matches){const c=document.getElementById("col-lista"); if(c) c.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})}
    });
    h.addEventListener("dragover",e=>{if(arrastrando&&arrastrando.pos===h.dataset.pos){e.preventDefault();h.classList.add("drop")}});
    h.addEventListener("dragleave",()=>h.classList.remove("drop"));
    h.addEventListener("drop",e=>{e.preventDefault(); const j=arrastrando; arrastrando=null; if(j&&j.pos===h.dataset.pos) alternar(j.id)});
  });
  pintarEstado(g,F);
}

function pintarEstado(g,F){
  const {base, o} = bases();
  const v=validar(borrador.ids,borrador.fijas), P=S.config.minimo;
  const pct=Math.min(100,v.gasto/P*100);
  const gd=document.getElementById("gasto");
  if(gd) gd.innerHTML=`<div class="small"><strong class="num">${M(v.gasto)}</strong> <span class="muted">gastados · mínimo ${M(P)}</span></div>
    <div class="meter" role="img" aria-label="Llevas el ${Math.round(pct)}% del gasto mínimo"><b style="width:${pct}%"></b></div>`;
  const sobran=POSS.flatMap(p=>g[p].slice(F[p]));
  const err=v.err.filter(e=>!/^(POR|DEF|MED|DEL):/.test(e));
  if(sobran.length) err.unshift(`Sobran para ${borrador.formacion}: ${sobran.map(j=>j.nombre+" ("+posB(j)+")").join(", ")}. Quítalos o cambia de sistema.`);
  const nc = base ? cambios(base.ids, borrador.ids) : 0;
  const conBaja = borrador.ids.map(i=>J.get(i)).filter(j=>j&&j.baja);
  if(base && nc>S.config.max_cambios) err.push(`Llevas ${nc} cambios respecto a tu equipo actual y el máximo es ${S.config.max_cambios}.`);
  const ok=!err.length && borrador.ids.length===11;
  const box=document.getElementById("estado-eq"); if(!box) return;
  const puedeGuardar = ok && o!==null && borrador.nombre.trim().length>=2 && borrador.manager.trim().length>=2;
  box.innerHTML=`${sobran.length?`<div class="sobra">${sobran.map(j=>`${esc(j.nombre)} <button class="mini sec" data-q="${j.id}">Quitar</button>`).join(" ")}</div>`:""}
    ${conBaja.length?`<div class="aviso">Ojo: ${conBaja.map(j=>`${esc(j.nombre)} (${BAJAS[j.baja][0].toLowerCase()})`).join(", ")}. Si no juega, resta −8.</div>`:""}
    ${base?`<p class="small">Cambios: <strong>${nc}</strong> de ${S.config.max_cambios}</p>`:""}
    ${ok?'<p class="ok-msg">Equipo válido.</p>':`<ul class="errs">${err.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`}
    <div class="cols-nombres">
      <div class="campo"><label for="nom-eq">Nombre del equipo</label><input id="nom-eq" maxlength="40" value="${esc(borrador.nombre)}" placeholder="Los Pataperros"></div>
      <div class="campo"><label for="nom-man">Tu nombre o apodo</label><input id="nom-man" maxlength="30" value="${esc(borrador.manager)}" placeholder="Nombre o apodo"></div>
    </div>
    <div class="acciones"><button id="guardar" ${puedeGuardar?"":"disabled"}>Guardar mi equipo</button>
    ${borrador.sucio?'<button class="sec" id="deshacer">Deshacer cambios</button>':""}
    <span class="estado-guardado" id="msg-g">${msgGuardar?`<span class="${msgGuardar.ok?"ok-txt":"err-txt"}">${esc(msgGuardar.t)}</span>`:(borrador.sucio?'<span class="muted">Tienes cambios sin guardar.</span>':"")}</span></div>`;
  box.querySelectorAll("button[data-q]").forEach(b=>b.addEventListener("click",()=>alternar(+b.dataset.q)));
  const nom=box.querySelector("#nom-eq"), man=box.querySelector("#nom-man"), gb=box.querySelector("#guardar");
  const chk=()=>{borrador.nombre=nom.value;borrador.manager=man.value;tocar();gb.disabled=!(ok&&o!==null&&nom.value.trim().length>=2&&man.value.trim().length>=2)};
  nom.addEventListener("input",chk); man.addEventListener("input",chk);
  gb.addEventListener("click",async()=>{
    gb.disabled=true; document.getElementById("msg-g").textContent="Guardando…";
    const {data,error}=await sb.rpc("guardar_equipo",{p_liga:ligaId, p_nombre:borrador.nombre.trim(), p_manager:borrador.manager.trim(), p_ids:borrador.ids, p_sistema:borrador.formacion});
    if(error){ msgGuardar={ok:false,t:error.message}; pintarCampo(); cargarOcupados(); return; }
    borrador.sucio=false; borrador.clave="";
    await recargar();
    msgGuardar={ok:true,t:`Guardado para la jornada ${data&&data.jornada}.`}; pintarCampo();
  });
  const dh=box.querySelector("#deshacer"); if(dh) dh.addEventListener("click",()=>{borrador.sucio=false;borrador.clave="";msgGuardar=null;render()});
}

/* ---------- jornadas ---------- */
let jSel=null;
const rkF={pos:"",club:"",pag:0};
function rankingJugadores(n){
  // n = número de jornada o "all" (temporada). Devuelve filas por jugador con puntos finales (con multiplicador).
  const ns = n==="all" ? nums() : [n], acc=new Map();
  ns.forEach(k=>{ const pts=S.jornadas[k].puntos;
    Object.entries(pts).forEach(([id,p])=>{ const j=J.get(+id); if(!j) return;
      let a=acc.get(j.id); if(!a){a={j,tot:0,bruto:0,pj:0,min:0,ult:null}; acc.set(j.id,a)}
      a.tot+=ptsFinal(p,j); a.bruto+=p.t; a.min+=p.min||0; if((p.min||0)>0) a.pj++; a.ult=p; });
  });
  return [...acc.values()].sort((a,b)=>b.tot-a.tot);
}
function vJornadas(el){
  const ns=nums();
  if(!ns.length){el.innerHTML=`<h2>Jornadas</h2><div class="vacio">Aún no se ha cargado ninguna jornada.</div>`;return}
  if(jSel!=="all" && !S.jornadas[jSel]) jSel=ns[ns.length-1];
  const todo=jSel==="all", jor=todo?null:S.jornadas[jSel];
  const rkJ=rankingJugadores(jSel);
  const clubs=[...new Set(S.jugadores.map(j=>j.equipo))].sort((a,b)=>a.localeCompare(b,"es"));
  let filtTodos=rkJ.filter(x=>(!rkF.pos||x.j.pos===rkF.pos)&&(!rkF.club||x.j.equipo===rkF.club));
  if(rkF.club){ const ya=new Set(filtTodos.map(x=>x.j.id)); S.jugadores.filter(j=>j.equipo===rkF.club&&(!rkF.pos||j.pos===rkF.pos)&&!ya.has(j.id)).forEach(j=>filtTodos.push({j,tot:0,bruto:0,pj:0,min:0,ult:null,sin:true})); }
  const POR_PAG=15, npag=Math.max(1,Math.ceil(filtTodos.length/POR_PAG));
  if(rkF.pag>=npag) rkF.pag=npag-1;
  const ini=rkF.club?0:rkF.pag*POR_PAG;
  const filtrados=rkF.club?filtTodos:filtTodos.slice(ini,ini+POR_PAG);
  // el once desastre: 4-4-2 con los mejores de cada posición (solo los que jugaron)
  const jugaron=rkJ.filter(x=>x.pj>0);
  const once={POR:1,DEF:4,MED:4,DEL:2};
  const lineaO=p=>`<div class="linea">${jugaron.filter(x=>x.j.pos===p).slice(0,once[p]).map(x=>`<div class="ficha" title="${esc(x.j.nombre)} · ${esc(x.j.equipo)}">${camiseta(x.j.equipo,30)}<div class="fn">${jn(x.j)}</div><div class="fc">${esc(x.j.equipo)}</div><div class="fp ${x.tot>0?"pos":x.tot<0?"neg":""}">${x.tot>0?"+":""}${f1(x.tot)}</div></div>`).join("")}</div>`;
  const rkE=(todo||!liga())?[]:S.equipos.map(eq=>({eq,r:puntosEquipo(eq,jSel)})).filter(x=>x.r).sort((a,b)=>b.r.total-a.r.total);
  el.innerHTML=`<h2>${todo?"Toda la temporada":"Jornada "+jSel}</h2>
  <div class="filtros" style="max-width:260px"><select id="jsel" aria-label="Elegir jornada"><option value="all"${todo?" selected":""}>Toda la temporada</option>${ns.map(n=>`<option value="${n}"${n===jSel?" selected":""}>Jornada ${n}</option>`).join("")}</select></div>
  ${todo?"":(jor.avisos||[]).filter(a=>!/sin cuotas/.test(a)).map(a=>`<div class="aviso">${esc(a)}</div>`).join("")}
  ${todo?"":`<h3 style="margin-top:16px">Partidos</h3>
  <div class="partidos">${jor.partidos.map(p=>`<div class="partido"><div class="res"><span>${esc(p.local)} – ${esc(p.visitante)}</span><span>${p.goles_local!=null?p.goles_local+"-"+p.goles_visitante:esc(p.estado||"")}</span></div></div>`).join("")}</div>`}
  <h3 style="margin-top:16px">El once desastre ${todo?"de la temporada":"de la jornada"}</h3>
  <p class="small muted">Los que más Puntos Desastre han dado en cada posición, con el multiplicador estrella ya aplicado.</p>

/* ---------- reglas ---------- */
function vReglas(el){
  const P=S.config.minimo, D=S.config.divisor, CL=CLASICA(), RM=CL?4:3;
  const fila=(a,b)=>`<tr><td>${a}</td><td class="num">${b}</td></tr>`;
  const n2=x=>(Math.round(x*100)/100).toLocaleString(LOC(),{minimumFractionDigits:2,maximumFractionDigits:2});
  const sg=x=>(x>0?"+":x<0?"−":"")+n2(Math.abs(x));
  const p2=x=>`<span class="pts ${x>0.0001?"pos":x<-0.0001?"neg":""}">${x>0.0001?"+":x<-0.0001?"−":""}${n2(Math.abs(x))}</span>`;
  const res=(pg,pe)=>{const E=pg+0.5*pe; return {E, gana:10*(E-1), empata:10*(E-0.5), pierde:10*E};};
  const rm=res(0.80,0.15), el_=res(0.05,0.15), be=res(0.40,0.30), se=res(0.30,0.30);
  const ejemplo=(a,b,ra,rb)=>`<table class="tabla-ej"><thead><tr><th>Resultado</th><th class="num">${a}</th><th class="num">${b}</th></tr></thead><tbody>
    <tr><td>Gana ${a}</td><td class="num">${p2(ra.gana)}</td><td class="num">${p2(rb.pierde)}</td></tr>
    <tr><td>Empate</td><td class="num">${p2(ra.empata)}</td><td class="num">${p2(rb.empata)}</td></tr>
    <tr><td>Gana ${b}</td><td class="num">${p2(ra.pierde)}</td><td class="num">${p2(rb.gana)}</td></tr></tbody></table>`;
  // ejemplo completo: defensa de 60 M
  const mEj=1+60/D, base=(6.5-5.8)*RM+(CL?0:2)+rm.pierde, fin=base*mEj;
  el.innerHTML=`<h2>Reglas</h2><p class="sub">Gana quien más Puntos Desastre acumula: jugadores que juegan, pero juegan mal.</p>
  <div class="cols"><div class="panel"><h3>Plantilla</h3><table><tbody>
  ${fila("Sistema","4-4-2 o 4-3-3")}${fila("Porteros","1")}${fila("Defensas","4")}${fila("Centrocampistas","3 o 4")}${fila("Delanteros","2 o 3")}
  ${fila("Gasto mínimo",M(P))}${fila("Gasto máximo","Sin límite")}${fila("Máximo por club","3")}${liga()?fila("Liga",esc(liga().nombre)):""}${fila("Modo",S.config.exclusivo?"Jugadores exclusivos":"Normal")}${fila("Puntuación",CL?"Clásica":"Desastre total")}${fila("Cambios por jornada",S.config.exclusivo?"Sin límite (equipo nuevo cada jornada)":S.config.max_cambios)}</tbody></table></div>
  <div class="panel"><h3>Puntos por partido</h3><table><tbody>
  ${CL?`${fila("No juega o no va convocado","−8")}${fila("Juega menos de 30 min","−3")}${fila("Rating","(6,5 − rating) × 4")}${fila("Resultado del equipo","10 × (E − A)")}</tbody></table>
  <p class="small muted">Puntuación clásica: nada más. Goles, tarjetas o penaltis ya influyen en la nota de SofaScore.</p><table><tbody>`
  :`  ${fila("No juega o no va convocado","−8")}${fila("Juega menos de 30 min","−3")}${fila("Rating","(6,5 − rating) × 3")}
  ${fila("Gol de defensa / medio / delantero o portero","−6 / −5 / −4")}${fila("Asistencia","−3")}${fila("Portería a cero (POR/DEF, 60+ min)","−4")}
  ${fila("Gol en propia","+6")}${fila("Comete penalti","+5")}${fila("Falla penalti","+6")}
  ${fila("Ocasión clara fallada","+3")}${fila("Error que acaba en gol del rival","+5")}
  ${fila("Amarilla","+2")}${fila("Doble amarilla","+5")}${fila("Roja directa","+7")}`}</tbody></table></div></div>

  <div class="panel" style="margin-top:16px"><h3>Modos de liga</h3>
  <p class="small">Quien crea la liga elige uno de estos dos modos. Después no se puede cambiar.${liga()?` <strong>Tu liga (${esc(liga().nombre)}) está en modo ${S.config.exclusivo?"jugadores exclusivos":"normal"}.</strong>`:""}</p>
  <div class="modos">
    <div class="modo${liga()&&!S.config.exclusivo?" actual":""}"><p class="modo-t">Normal${liga()&&!S.config.exclusivo?' <span class="chip ok">tu liga</span>':""}</p>
      <ul class="small"><li>Varios equipos pueden tener al mismo jugador.</li><li>Tu equipo se mantiene de una jornada a otra.</li><li>Solo puedes hacer los cambios por jornada que marque la liga${liga()&&!S.config.exclusivo?` (en la tuya, ${S.config.max_cambios})`:""}.</li><li>Si no tocas nada, juegas con la alineación de la jornada anterior.</li></ul></div>
    <div class="modo${liga()&&S.config.exclusivo?" actual":""}"><p class="modo-t">Jugadores exclusivos${liga()&&S.config.exclusivo?' <span class="chip ok">tu liga</span>':""}</p>
      <ul class="small"><li>Cada jugador solo puede estar en un equipo de la liga: se lo queda el primero que guarda su alineación con él.</li><li>Cada jornada los equipos empiezan vacíos y hay que montarlos de nuevo antes del primer partido.</li><li>No hay límite de cambios.</li><li>Quien no guarde alineación suma −88, como si sus 11 jugadores no hubieran jugado.</li></ul></div>
  </div></div>
  ${CL?"":`<div class="panel" style="margin-top:16px"><h3>Ocasiones claras y errores</h3>
  <p class="small">Según SofaScore, una ocasión clara es una jugada en la que lo normal sería marcar: solo ante el portero, un remate a bocajarro… Cada una que el jugador falla suma +3. Los penaltis fallados no cuentan aquí, porque ya suman +6 aparte.</p>
  <p class="small">Un error que acaba en gol es un fallo del propio jugador (un mal pase atrás, un balón que se le escapa al portero…) que termina en gol del rival. Suma +5.</p>
  <p class="small muted">Ejemplo: un delantero falla dos ocasiones claras y un penalti: 2 × 3 + 6 = +12, además de lo que sume por rating y resultado.</p></div>`}
  <div class="panel" style="margin-top:16px"><h3>Puntuación: Clásica o Desastre total</h3>
  <p class="small">Cada liga elige cómo se puntúa.${liga()?` <strong>Tu liga (${esc(liga().nombre)}) usa la puntuación ${CL?"clásica":"desastre total"}.</strong>`:""}</p>
  <div class="modos">
    <div class="modo${liga()&&!CL?" actual":""}"><p class="modo-t">Desastre total${liga()&&!CL?' <span class="chip ok">tu liga</span>':""}</p>
      <ul class="small"><li>Nota de SofaScore × 3 y resultado del equipo.</li><li>Además: goles, asistencias, tarjetas, penaltis, goles en propia, ocasiones claras falladas, errores que acaban en gol y portería a cero.</li><li>Una roja o un penalti fallado se notan muchísimo.</li></ul></div>
    <div class="modo${liga()&&CL?" actual":""}"><p class="modo-t">Clásica${liga()&&CL?' <span class="chip ok">tu liga</span>':""}</p>
      <ul class="small"><li>Solo la nota de SofaScore × 4 y el resultado del equipo.</li><li>La nota ya resume todo el partido: goles, pases, tarjetas, errores…</li><li>Más sencilla y sin contar nada dos veces.</li></ul></div>
  </div>
  <p class="small muted">En las dos: no jugar resta −8, jugar menos de 30 minutos resta −3 y se aplica el multiplicador estrella.</p></div>
  <div class="panel" style="margin-top:16px"><h3>Rating</h3>
  <p class="small">El rating es la nota que SofaScore pone a cada jugador en cada partido, de 3 a 10. Un 6,5 es un partido normal: no suma ni resta. Por cada punto por debajo de 6,5 sumas ${RM}; por cada punto por encima, restas ${RM}.</p>
  <table class="tabla-ej"><thead><tr><th>Rating</th><th>Cuenta</th><th class="num">Puntos</th></tr></thead><tbody>
  <tr><td>5,0 (partido malo)</td><td>(6,5 − 5,0) × ${RM}</td><td class="num">${ptsHtml((6.5-5.0)*RM)}</td></tr>
  <tr><td>6,0 (flojo)</td><td>(6,5 − 6,0) × ${RM}</td><td class="num">${ptsHtml((6.5-6.0)*RM)}</td></tr>
  <tr><td>6,5 (normal)</td><td>(6,5 − 6,5) × ${RM}</td><td class="num">${ptsHtml((6.5-6.5)*RM)}</td></tr>
  <tr><td>7,5 (bueno)</td><td>(6,5 − 7,5) × ${RM}</td><td class="num">${ptsHtml((6.5-7.5)*RM)}</td></tr>
  <tr><td>9,0 (partidazo)</td><td>(6,5 − 9,0) × ${RM}</td><td class="num">${ptsHtml((6.5-9.0)*RM)}</td></tr></tbody></table></div>

  <div class="panel" style="margin-top:16px"><h3>Resultado del equipo</h3>
  <p class="small">Premia la <strong>sorpresa</strong>, no simplemente perder. Antes del partido, las cuotas de las casas de apuestas se convierten en probabilidades. Con ellas se calcula el resultado esperado de cada equipo, <span class="pts">E = P(gana) + 0,5 · P(empata)</span>, y se compara con el real, <span class="pts">A</span>, que vale 1 si gana, 0,5 si empata y 0 si pierde. Cada jugador que sale al campo suma <span class="pts">10 × (E − A)</span>.</p>
  <div class="cols-ej">
   <div><p class="small"><strong>Ejemplo 1: Real Madrid – Elche</strong> (gran favorito contra colista)<br>
   Probabilidades: Madrid gana 80 %, empate 15 %, Elche gana 5 %.<br>
   E Madrid = 0,80 + 0,5 × 0,15 = <strong>${n2(rm.E)}</strong> · E Elche = 0,05 + 0,5 × 0,15 = <strong>${n2(el_.E)}</strong></p>
   ${ejemplo("Real Madrid","Elche",rm,el_)}
   <p class="small muted">Si gana el Madrid, lo esperado, apenas se mueve nada. Si pierde, sus jugadores suman ${sg(rm.pierde)} cada uno.</p></div>
   <div><p class="small"><strong>Ejemplo 2: Betis – Sevilla</strong> (partido igualado)<br>
   Probabilidades: Betis gana 40 %, empate 30 %, Sevilla gana 30 %.<br>
   E Betis = 0,40 + 0,5 × 0,30 = <strong>${n2(be.E)}</strong> · E Sevilla = 0,30 + 0,5 × 0,30 = <strong>${n2(se.E)}</strong></p>
   ${ejemplo("Betis","Sevilla",be,se)}
   <p class="small muted">En un partido igualado, perder da unos ${n2(be.pierde)} puntos y ganar quita más o menos lo mismo.</p></div>
  </div>
  <p class="small muted">Por eso fichar solo jugadores del colista no sirve: cuando pierden, era lo esperado y casi no suman.</p></div>

  <div class="panel" style="margin-top:16px"><h3>Multiplicador estrella</h3><p class="small">Si un jugador termina la jornada en positivo (jugó mal), sus puntos se multiplican por <span class="pts">1 + precio / ${D}</span>. Si termina en negativo o no juega, no se multiplica.</p>
  <table><tbody>${[1,20,60,150,237].map(p=>fila(p+" M",fx(1+p/D))).join("")}</tbody></table>
  <p class="small muted">Fichar a una estrella es una apuesta: casi siempre resta lo normal, pero su mal día vale por muchos.</p></div>

  <div class="panel" style="margin-top:16px"><h3>Ejemplo completo</h3>
  <p class="small">Un defensa del Real Madrid que cuesta 60 M juega los 90 minutos contra el Elche y el Madrid pierde 0-1:</p>
  <table class="tabla-ej"><tbody>
  <tr><td>Rating 5,8</td><td class="num">${ptsHtml((6.5-5.8)*RM)}</td></tr>
  ${CL?"":`<tr><td>Amarilla</td><td class="num">${ptsHtml(2)}</td></tr>`}
  <tr><td>Resultado: pierde siendo favorito (E = ${n2(rm.E)}, A = 0)</td><td class="num">${ptsHtml(rm.pierde)}</td></tr>
  <tr><td><strong>Suma</strong></td><td class="num">${ptsHtml(base)}</td></tr>
  <tr><td>Multiplicador estrella (1 + 60 / ${D})</td><td class="num">${fx(mEj)}</td></tr>
  <tr><td><strong>Total de la jornada</strong></td><td class="num"><strong>${ptsHtml(fin)}</strong></td></tr></tbody></table>
  <p class="small muted">Si ese mismo defensa hubiera hecho un buen partido (rating 7,5) y el Madrid ganara, sumaría ${ptsHtml(-RM+rm.gana)}, sin multiplicador porque sale negativo.</p></div>`;
}

  el.querySelector("#f-unir").addEventListener("submit",async e=>{
    e.preventDefault(); const cod=el.querySelector("#u-cod").value.trim().toUpperCase();

    const {data,error}=await sb.rpc("unirse_liga",{p_codigo:cod});
    if(error){ aviso(false,error.message); return; }
    nuevaLiga=null; ligaId=data.id; guardaLocal("ld_liga",data.id);
    aviso(true,`Te has unido a ${data.nombre}. Ahora monta tu equipo en Mi equipo.`);
  });
  el.querySelector("#f-crear").addEventListener("submit",async e=>{
    e.preventDefault();
    const nombre=el.querySelector("#c-nom").value.trim();
    if(nombre.length<3){ msgLigas={ok:false,t:"Ponle a la liga un nombre de al menos 3 caracteres."}; vLigas(el); return; }
    const {data,error}=await sb.rpc("crear_liga",{p_nombre:nombre, p_minimo:+el.querySelector("#c-min").value||0, p_max_cambios:+el.querySelector("#c-camb").value||0,
      p_divisor:+el.querySelector("#c-div").value||25, p_exclusivo:el.querySelector("#c-excl").checked,
      p_puntuacion:(el.querySelector('input[name="c-punt"]:checked')||{}).value||"total"});

      const v={minimo:+el.querySelector("#g-min").value, divisor:+el.querySelector("#g-div").value, max_cambios:Math.max(0,Math.min(11,+el.querySelector("#g-camb").value||0)), puntuacion:el.querySelector("#g-punt").value};
      if(!(v.minimo>=0&&v.divisor>=1)){aviso(false,"Revisa los números: el divisor debe ser al menos 1.");return}
      const {error}=await sb.from("ligas").update(v).eq("id",l.id);
      aviso(!error, error?"No se pudieron guardar las reglas: "+error.message:"Reglas guardadas.");
    });
    el.querySelectorAll("[data-gm]").forEach(b=>b.addEventListener("click",async()=>{
      const id=b.dataset.gm, mail=el.querySelector(`[data-mail="${id}"]`).value.trim().toLowerCase();
      let error;
      if(!mail) ({error}=await sb.from("propietarios").delete().eq("equipo_id",id));
      else ({error}=await sb.from("propietarios").upsert({equipo_id:id,liga_id:l.id,email:mail},{onConflict:"equipo_id"}));

    }));
    el.querySelectorAll("[data-be]").forEach(b=>b.addEventListener("click",async()=>{
      if(!b.dataset.c){b.dataset.c=1;b.textContent="¿Seguro?";return}
      const {error}=await sb.from("equipos").delete().eq("id",b.dataset.be);
      aviso(!error, error?"No se pudo quitar: "+error.message:"Equipo quitado de la liga.");
    }));
    el.querySelector("#g-borrar").addEventListener("click",async e=>{
      const b=e.currentTarget; if(!b.dataset.c){b.dataset.c=1;b.textContent="Pulsa otra vez para borrarla del todo";return}
      const {error}=await sb.from("ligas").delete().eq("id",l.id);
      if(!error){ ligaId=null; guardaLocal("ld_liga",""); }
      aviso(!error, error?"No se pudo borrar: "+error.message:"Liga borrada.");
    });
  }
}

let msgAdmin = null;
function vAdmin(el){
  const ns=nums(), calN=Object.keys(S.cal).length, o=objetivo();
  el.innerHTML=`<h2>Administración</h2>
  ${msgAdmin?`<div class="aviso${msgAdmin.ok?"":" err"}">${esc(msgAdmin.t)}</div>`:""}
  <div class="cols">
   <div class="panel"><h3>Estado de los datos</h3>
    <p class="small">${S.jugadores.length} jugadores · ${ns.length} jornada${ns.length===1?"":"s"} con puntos · calendario de ${calN} jornada${calN===1?"":"s"}.</p>
    <p class="small">${o!==null?`Próximo cierre de alineaciones: <strong>jornada ${o}</strong>, ${esc(fecha(S.cal[o]))}.`:'<span class="err-txt">No hay ninguna jornada futura en el calendario: nadie puede guardar equipos. Ejecuta <code>python desastre.py calendario</code>.</span>'}</p>
    ${ns.map(n=>`<div class="fila-admin"><span>Jornada ${n}</span><span class="muted small">${S.jornadas[n].actualizado?"actualizada "+esc(hace(S.jornadas[n].actualizado)):""}</span></div>`).join("")}
    <p class="muted small" style="margin-top:10px">Los puntos los sube el script de tu ordenador. Si no puede, sube aquí los archivos a mano:</p>
    <label for="fsubir">Subir jugadores.json o jornada_N.json</label><input type="file" id="fsubir" multiple accept=".json,application/json"></div>
   <div class="panel"><h3>Corregir posición</h3>
    <p class="small muted">Para jugadores mal clasificados por SofaScore. Vale para equipos nuevos y cambios en todas las ligas; los ya fichados mantienen la posición con la que se ficharon.</p>
    <div class="campo"><label for="buscapos">Buscar jugador</label><input id="buscapos" type="search" placeholder="Yamal, Raphinha…" autocomplete="off"></div>
    <div id="respos"></div></div>
  </div>`;
  const aviso=(ok,t)=>{msgAdmin={ok,t}; scrollTo(0,0); recargar();};
  el.querySelector("#fsubir").addEventListener("change",async e=>{
    const res=[];
    for(const f of e.target.files){
      try{
        const d=JSON.parse(await f.text());
        if(Array.isArray(d.jugadores)){
          const rows=d.jugadores.map(j=>({id:j.id,nombre:j.nombre,equipo:j.equipo,equipo_id:j.equipo_id||null,pos:j.pos,precio:j.precio}));
          for(let i=0;i<rows.length;i+=500){const {error}=await sb.from("jugadores").upsert(rows.slice(i,i+500),{onConflict:"id"}); if(error) throw error;}
          res.push(`${f.name}: ${rows.length} jugadores`);
        } else if(d.jornada&&d.puntos){
          const row={n:d.jornada,partidos:d.partidos||[],puntos:d.puntos,avisos:d.avisos||[],actualizado:new Date().toISOString()};
          if(d.inicio) row.inicio=d.inicio;
          const {error}=await sb.from("jornadas").upsert(row,{onConflict:"n"}); if(error) throw error;
          res.push(`${f.name}: jornada ${d.jornada}`);
        } else throw new Error("no es un archivo de la liga");
      }catch(err){res.push(`${f.name}: error (${err.message||err})`)}
    }
    aviso(!res.some(r=>r.includes("error")), "Subida: "+res.join(" · "));
  });
  const bp=el.querySelector("#buscapos"), rp=el.querySelector("#respos");
  const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  bp.addEventListener("input",()=>{
    const q=norm(bp.value.trim()); if(q.length<2){rp.innerHTML="";return}
    const l=S.jugadores.filter(j=>norm(j.nombre).includes(q)).slice(0,8);
    rp.innerHTML=l.map(j=>`<div class="fila-admin"><span>${jn(j)} <span class="muted small">· ${esc(j.equipo)} · ${M(j.precio)}${j.pos_manual?` · corregido (SofaScore: ${j.pos_orig})`:""}</span></span>
      <select data-pp="${j.id}" aria-label="Posición de ${esc(j.nombre)}" style="width:auto">${POSS.map(p=>`<option value="${p}"${p===j.pos?" selected":""}>${p}</option>`).join("")}</select></div>`).join("")||'<p class="muted small">Ningún jugador con ese nombre.</p>';
    rp.querySelectorAll("[data-pp]").forEach(s=>s.addEventListener("change",async()=>{
      const j=J.get(+s.dataset.pp); if(!j) return;
      const val = s.value===j.pos_orig ? null : s.value;
      const {error}=await sb.from("jugadores").update({pos_manual:val}).eq("id",j.id);
      aviso(!error, error?"No se pudo cambiar: "+error.message:`${j.nombre} pasa a ${s.value}.`);
    }));
  });
}

  ["parada","Kylian Mbappé · Eurocopa 2021","Sommer le para el último penalti de la tanda y Suiza elimina a Francia.","Sommer saves his last shoot-out penalty and Switzerland knock out France.","Mbappé penalti Suiza Eurocopa"],
  ["parada","Gareth Southgate · Eurocopa 1996","Le paran el penalti en la tanda de semifinales ante Alemania, en Wembley.","His semi-final shoot-out penalty against Germany at Wembley is saved.","Southgate penalti Alemania 1996"],
  ["resbalon","Sebastián Abreu · Libertadores 1996","Con San Lorenzo en el Monumental, regatea al portero de River, el narrador ya canta el gol… y se enreda solo y la manda fuera.","Playing for San Lorenzo at River's stadium, he rounds the keeper, the commentator is already calling the goal… and he trips over himself and puts it wide.","https://www.youtube.com/watch?v=J3kTA4fXQuc"],
  ["vacia","Lamine Yamal · Clásico 2026","Al borde del descanso, desde muy cerca, la manda fuera. El Madrid acaba ganando 2-1.","Just before half-time, from close range, he puts it wide. Madrid go on to win 2-1.","Lamine Yamal fallo Clásico octubre 2026"]
];
const desSlot = {};   // hueco -> índice mostrado
const nuevoDes = hueco => { const usados=new Set(Object.entries(desSlot).filter(([k])=>k!==hueco).map(([,v])=>v));
  const libres=DESASTRES.map((_,i)=>i).filter(i=>!usados.has(i)&&i!==desSlot[hueco]); return libres[Math.floor(Math.random()*libres.length)]; };
const tarjetaDes = k => { const [t,q,es,en,yt]=DESASTRES[k]; const ingles=LANG==="en";
  return `<div class="des-ilu">${ILU[t]}</div><p class="des-q">${esc(q)}</p><p class="des-t">${esc(ingles?en:es)}</p>
    <a class="des-yt" href="${/^https:/.test(yt)?yt:"https://www.youtube.com/results?search_query="+encodeURIComponent(yt)}" target="_blank" rel="noopener">▶ ${ingles?"Watch it":"Ver la jugada"}</a>`; };
function pintarDesastres(){
  document.querySelectorAll("[data-des]").forEach(n=>{ const h=n.dataset.des; if(desSlot[h]===undefined) desSlot[h]=nuevoDes(h); n.innerHTML=tarjetaDes(desSlot[h]); });
}
let desTurno = 0;
setInterval(()=>{
  if(document.visibilityState!=="visible") return;
  const vis=[...document.querySelectorAll("[data-des]")].filter(n=>n.offsetParent!==null); if(!vis.length) return;
  const n=vis[desTurno++ % vis.length], h=n.dataset.des; desSlot[h]=nuevoDes(h); n.innerHTML=tarjetaDes(desSlot[h]);
}, 4000);
const bannerDes = lado => `<aside class="desastres des-${lado}" aria-label="Momentos desastre"><p class="des-cab">Momentos desastre</p>
  ${(lado==="movil"?[0]:[0,1]).map(i=>`<div class="des-card" data-des="${lado}${i}"></div>`).join("")}</aside>`;
const gridDes = () => `<section class="des-grid-wrap" aria-label="Momentos desastre"><h3 class="des-cab">Momentos desastre <span class="muted small">· así se juega aquí</span></h3>
  <div class="des-grid">${[0,1,2].map(i=>`<div class="des-card" data-des="ini${i}"></div>`).join("")}</div></section>`;

/* ---------- entrar / registrarse / contraseña ---------- */
let modoEntrar = "entrar", recuperando = false;
const urlWeb = () => location.origin + location.pathname;
function vEntrar(el){
  if(recuperando && user){
    el.innerHTML=`<div class="panel entrar"><h2>Nueva contraseña</h2>
      <form id="f-nueva" novalidate>
        <div class="campo"><label for="n-pass">Escribe tu nueva contraseña</label><input id="n-pass" type="password" autocomplete="new-password" minlength="6" required>
        <p class="muted small">Mínimo 6 caracteres.</p></div>
        <button type="submit">Guardar contraseña</button>
        <p class="small" id="e-msg" role="status"></p>
      </form></div>`;
    el.querySelector("#f-nueva").addEventListener("submit",async e=>{
      e.preventDefault();
      const password=el.querySelector("#n-pass").value, msg=el.querySelector("#e-msg");
      if(password.length<6){msg.className="small err-txt";msg.textContent="La contraseña debe tener al menos 6 caracteres.";return}
      msg.className="small muted"; msg.textContent="Guardando…";
      const {error}=await sb.auth.updateUser({password});
      if(error){msg.className="small err-txt";msg.textContent="No se pudo: "+error.message;return}
      recuperando=false; msg.className="small ok-txt"; msg.textContent="Contraseña cambiada.";
      setTimeout(()=>{location.hash="#fichar"},1200);
    });
    return;
  }
  if(user){ el.innerHTML=`<h2>Ya has entrado</h2><p>Has iniciado sesión como <strong>${esc(user.email)}</strong>. Ve a <a href="#ligas">Ligas</a> o a <a href="#fichar">Mi equipo</a>.</p>`; return; }
  const olvido = modoEntrar==="olvido";
  el.innerHTML=`<div class="panel entrar">
    <div class="pestanas" role="tablist">
      <button role="tab" class="${modoEntrar==="entrar"?"on":""}" data-m="entrar" aria-selected="${modoEntrar==="entrar"}">Entrar</button>
      <button role="tab" class="${modoEntrar==="registro"?"on":""}" data-m="registro" aria-selected="${modoEntrar==="registro"}">Crear cuenta</button>
    </div>
    <form id="f-entrar" novalidate>
      ${olvido?'<p>Escribe tu correo y te mandamos un enlace para poner una contraseña nueva.</p>':""}
      <div class="campo"><label for="e-mail">Correo</label><input id="e-mail" type="email" autocomplete="email" required></div>
      ${olvido?"":`<div class="campo"><label for="e-pass">Contraseña</label><input id="e-pass" type="password" autocomplete="${modoEntrar==="entrar"?"current-password":"new-password"}" minlength="6" required>
        ${modoEntrar==="registro"?'<p class="muted small">Mínimo 6 caracteres. Te mandaremos un correo para confirmar que es tuyo. Tu correo no lo ve nadie más que el administrador.</p>':""}</div>`}
      <button type="submit">${olvido?"Enviar enlace":modoEntrar==="entrar"?"Entrar":"Crear cuenta"}</button>
      <p class="small" id="e-msg" role="status"></p>
      ${modoEntrar==="entrar"?'<p class="small"><a href="#entrar" data-m="olvido">¿Has olvidado la contraseña?</a></p>':""}
      ${olvido?'<p class="small"><a href="#entrar" data-m="entrar">Volver a entrar</a></p>':""}
    </form></div>`;
  el.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click",ev=>{ev.preventDefault();modoEntrar=b.dataset.m;vEntrar(el)}));
  el.querySelector("#f-entrar").addEventListener("submit",async e=>{
    e.preventDefault();
    const email=el.querySelector("#e-mail").value.trim(), msg=el.querySelector("#e-msg");
    const pi=el.querySelector("#e-pass"), password=pi?pi.value:"";
    if(!/^\S+@\S+\.\S+$/.test(email)){msg.className="small err-txt";msg.textContent="Escribe un correo válido.";return}
    if(olvido){
      msg.className="small muted"; msg.textContent="Enviando…";
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:urlWeb()});
      if(error){msg.className="small err-txt";msg.textContent=/rate|seconds/i.test(error.message)?"Espera un minuto y vuelve a probar.":"No se pudo: "+error.message;return}
      msg.className="small ok-txt"; msg.textContent="Si ese correo tiene cuenta, te hemos mandado un enlace. Mira también en spam.";
      return;
    }
    if(password.length<6){msg.className="small err-txt";msg.textContent="La contraseña debe tener al menos 6 caracteres.";return}
    msg.className="small muted"; msg.textContent=modoEntrar==="entrar"?"Entrando…":"Creando la cuenta…";
    const r = modoEntrar==="entrar" ? await sb.auth.signInWithPassword({email,password})
      : await sb.auth.signUp({email,password,options:{emailRedirectTo:urlWeb()}});
    if(r.error){
      const m=r.error.message||"";
      msg.className="small err-txt";
      if(/email not confirmed/i.test(m)){
        msg.innerHTML=`Todavía no has confirmado tu correo. Busca el mensaje de Liga Desastre (mira también en spam) y pulsa el enlace. <button type="button" class="mini sec" id="reenviar">Reenviar correo</button>`;
        msg.querySelector("#reenviar").addEventListener("click",async()=>{
          const {error}=await sb.auth.resend({type:"signup",email,options:{emailRedirectTo:urlWeb()}});
          msg.className=error?"small err-txt":"small ok-txt";
          msg.textContent=error?(/rate|seconds/i.test(error.message)?"Espera un minuto y vuelve a probar.":"No se pudo: "+error.message):"Correo reenviado. Mira también en spam.";
        });
        return;
      }
      msg.textContent=/invalid login/i.test(m)?"Correo o contraseña incorrectos."
        :/already registered|already been registered/i.test(m)?"Ese correo ya tiene cuenta. Usa la pestaña Entrar."
        :/rate|seconds/i.test(m)?"Espera un minuto y vuelve a probar."
        :"No se pudo: "+m;
      return;
    }
    if(modoEntrar==="registro" && !r.data.session){
      msg.className="small ok-txt";
      msg.textContent=`Casi está. Te hemos mandado un correo a ${email}. Pulsa el enlace que trae y ya podrás entrar. Si no lo ves, mira en spam.`; return; }
    location.hash = "#inicio";
  });
}

/* ---------- arranque ---------- */
if(sb){
  sb.auth.onAuthStateChange((ev,session)=>{
    const antes=user&&user.id, ahora=session&&session.user&&session.user.id;
    user=session?session.user:null;
    if(ev==="PASSWORD_RECOVERY"){ recuperando=true; history.replaceState(null,"",location.pathname+"#entrar"); render(); }
    if(antes!==ahora){ borrador.sucio=false; borrador.clave=""; ligaId=null; recargar(); }
  });
  sb.auth.getSession().then(({data})=>{ user=data.session?data.session.user:null; recargar(); });
  setInterval(()=>{ if(document.visibilityState==="visible") recargar(true); }, 3*60*1000);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && Date.now()-ultimaCarga>60*1000) recargar(true); });
}
render();
})();

</script>
</body>
</html>
